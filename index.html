<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ajedrez</title>
<style>
:root{--bg:#f4f3f8;--card:#fff;--ink:#1f1b2e;--mute:#6d6883;--lt:#f0e9dc;--dk:#7d9bab;--ac:#5b4bd6;--act:#fff;--sel:#ffd866;--chk:#ef5b5b;--line:#dcd8ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13111c;--card:#1d1a2b;--ink:#ece9f7;--mute:#9a95b3;--ac:#8b7dff;--act:#13111c;--line:#322e48}}
:root[data-theme="dark"]{--bg:#13111c;--card:#1d1a2b;--ink:#ece9f7;--mute:#9a95b3;--ac:#8b7dff;--act:#13111c;--line:#322e48}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 12px 28px}
#tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
#tabs button{border:0;background:none;color:var(--mute);font:600 15px system-ui,sans-serif;padding:9px 22px;border-radius:999px}
#tabs button[aria-pressed=true]{background:var(--ac);color:var(--act)}
#st{font-size:16px;font-weight:600;min-height:22px;text-align:center;max-width:440px}
.dt{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;border:2px solid var(--ink);vertical-align:-1px}
.dw{background:#fff}.db{background:#15121f}
#b{--c:min(94vw,440px);width:var(--c);height:var(--c);display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden;box-shadow:0 8px 30px #1f1b2e30}
.q{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;font-size:calc(var(--c)/8*.56);line-height:1;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",sans-serif}
.l{background:var(--lt)}.d{background:var(--dk)}
